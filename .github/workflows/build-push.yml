name: Build and push image

on:
  push:
    branches: [main]

# id-token: write lets the job request an OIDC token for AWS
permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tag = <VERSION>-<short sha>, e.g. 1.0.0-a1b2c3d
      - name: Compute image tag
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${VERSION}-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      # Assume the IAM role via OIDC (no static keys)
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::030454160336:role/exam-github-action
          aws-region: eu-west-2
          retry-max-attempts: 1

      # Log Docker in to ECR; exposes the registry URL as an output
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # Build and push only the versioned tag (repo is immutable, no "latest")
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/hello-world:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
